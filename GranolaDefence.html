    ctx.fillStyle = '#7ee081';
    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillText(lines[i][0], px + 60, ly);
    ctx.fillStyle = '#9fb0c6';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText(lines[i][1], px + 220, ly);
    ly += 24;
  }

  var r = getMenuRegions();
  var hoverP1 = pointInRect(mouse, r.p1);
  var hoverP2 = pointInRect(mouse, r.p2);
  var pulse = 0.6 + 0.4 * Math.sin(performance.now() / 350);

  ctx.textAlign = 'center';
  ctx.font = 'bold 22px system-ui, sans-serif';

  ctx.fillStyle = hoverP1 ? 'rgba(180,255,180,1)' : 'rgba(126,224,129,' + pulse + ')';
  ctx.fillText('[ 1 ]  SINGLE PLAYER', W / 2 - 150, py + ph - 62);
  if (hoverP1) {
    ctx.save();
    ctx.strokeStyle = 'rgba(126,224,129,0.75)';
    ctx.lineWidth = 2;
    roundRect(ctx, r.p1.x, r.p1.y, r.p1.w, r.p1.h, 8);
    ctx.stroke();
    ctx.restore();
  }

  ctx.fillStyle = hoverP2 ? 'rgba(255,240,160,1)' : 'rgba(255,212,95,' + pulse + ')';
  ctx.fillText('[ 2 ]  2P CO-OP', W / 2 + 150, py + ph - 62);
  if (hoverP2) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,212,95,0.75)';
    ctx.lineWidth = 2;
    roundRect(ctx, r.p2.x, r.p2.y, r.p2.w, r.p2.h, 8);
    ctx.stroke();
    ctx.restore();
  }

  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#4a5b70';
  ctx.fillText('Robbers snatch ' + STEAL_AMOUNT + ' granola and flee — shoot them to recover it!', W / 2, py + ph - 26);

  ctx.restore();
}

function getSeasonRegions() {
  var pw = Math.min(860, W - 40);
  var ph = Math.min(600, H - 40);
  var px = W / 2 - pw / 2;
  var py = H / 2 - ph / 2;

  var cardW = Math.min(160, (pw - 100) / 4);
  var cardH = 220;
  var gap = 16;
  var totalW = cardW * 4 + gap * 3;
  var startX = W / 2 - totalW / 2;
  var cardY = py + 100;

  var cards = [];
  for (var i = 0; i < 4; i++) {
    cards.push({ x: startX + i * (cardW + gap), y: cardY, w: cardW, h: cardH, index: i });
  }

  var modeW = Math.min(210, (pw - 60) / 2);
  var modeH = 44;
  var modeGap = 14;
  var totalModeW = modeW * 2 + modeGap;
  var modeStartX = W / 2 - totalModeW / 2;
  var modeY = cardY + cardH + 12;

  var todW = Math.min(210, (pw - 60) / 2);
  var todH = 44;
  var todGap = 14;
  var totalTodW = todW * 2 + todGap;
  var todStartX = W / 2 - totalTodW / 2;
  var todY = modeY + modeH + 10;

  return {
    cards: cards,
    cycle:  { x: modeStartX,                y: modeY, w: modeW, h: modeH },
    random: { x: modeStartX + modeW + modeGap, y: modeY, w: modeW, h: modeH },
    day:    { x: todStartX,                 y: todY, w: todW, h: todH },
    night:  { x: todStartX + todW + todGap, y: todY, w: todW, h: todH },
    start:  { x: W / 2 - 220, y: py + ph - 50, w: 440, h: 44 }
  };
}

function drawSeasonScreen() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, W, H);

  var pw = Math.min(860, W - 40);
  var ph = Math.min(600, H - 40);
  var px = W / 2 - pw / 2;
  var py = H / 2 - ph / 2;
  panel(px, py, pw, ph);

  ctx.textAlign = 'center';
  ctx.font = 'bold 30px system-ui, sans-serif';
  ctx.fillStyle = '#e8c24a';
  ctx.fillText('CHOOSE SEASON, TIME OF DAY', W / 2, py + 50);

  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = '#8fa0b8';
  ctx.fillText(
    (G.mode === 2 ? '2 Player Co-op' : 'Single Player') +
    '  |  Fixed · CYCLE · RANDOM  |  Day or Night',
    W / 2, py + 76
  );

  var r = getSeasonRegions();

  for (var i = 0; i < 4; i++) {
    var info = SEASON_INFO[i];
    var card = r.cards[i];
    var selected = G.seasonChoice === i;
    var hovered = pointInRect(mouse, card);

    ctx.save();
    if (selected) {
      var pulse = 0.5 + 0.5 * Math.sin(performance.now() / 260);
      ctx.shadowColor = info.color;
      ctx.shadowBlur = 12 + pulse * 14;
    } else if (hovered) {
      ctx.shadowColor = info.color;
      ctx.shadowBlur = 8;
    }

    ctx.fillStyle = selected ? 'rgba(30,44,62,0.98)'
                   : hovered  ? 'rgba(22,30,44,0.98)'
                   : 'rgba(14,20,30,0.9)';
    roundRect(ctx, card.x, card.y, card.w, card.h, 12);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = selected ? info.color
                    : hovered  ? 'rgba(180,200,230,0.65)'
                    : 'rgba(110,130,160,0.35)';
    ctx.lineWidth = selected ? 3 : (hovered ? 2 : 1.5);
    roundRect(ctx, card.x, card.y, card.w, card.h, 12);
    ctx.stroke();
    ctx.restore();

    ctx.textAlign = 'center';
    ctx.font = '30px system-ui, sans-serif';
    ctx.fillStyle = info.color;
    ctx.fillText(info.icon, card.x + card.w / 2, card.y + 40);

    ctx.font = 'bold 14px system-ui, sans-serif';
    ctx.fillStyle = selected ? '#e8f0ff' : (hovered ? '#cfdcee' : '#9fb0c6');
    ctx.fillText(info.name, card.x + card.w / 2, card.y + 62);

    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.fillStyle = '#7ee081';
    ctx.fillText('[YOU]', card.x + card.w / 2, card.y + 82);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = selected ? '#cfe6cf' : '#8ca88c';
    wrapText(info.playerPerk, card.x + card.w / 2, card.y + 96, card.w - 14, 11);

    ctx.font = 'bold 10px system-ui, sans-serif';
    ctx.fillStyle = '#e07a5a';
    ctx.fillText('[ROBBERS]', card.x + card.w / 2, card.y + 144);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = selected ? '#e0c0b0' : '#a08878';
    wrapText(info.robberPerk, card.x + card.w / 2, card.y + 158, card.w - 14, 11);

    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.fillStyle = selected ? info.color : (hovered ? '#a8bbd2' : '#5a6b80');
    ctx.fillText('[ ' + (i + 1) + ' ]', card.x + card.w / 2, card.y + card.h - 8);
  }

  var cycSel = G.seasonChoice === SEASON_CYCLE;
  var cycHover = pointInRect(mouse, r.cycle);

  ctx.save();
  if (cycSel) {
    var pulseC = 0.5 + 0.5 * Math.sin(performance.now() / 260);
    ctx.shadowColor = '#e8c24a';
    ctx.shadowBlur = 10 + pulseC * 12;
  } else if (cycHover) {
    ctx.shadowColor = '#e8c24a';
    ctx.shadowBlur = 8;
  }
  ctx.fillStyle = cycSel ? 'rgba(34,42,26,0.98)'
                 : cycHover ? 'rgba(28,34,22,0.98)'
                 : 'rgba(14,20,30,0.9)';
  roundRect(ctx, r.cycle.x, r.cycle.y, r.cycle.w, r.cycle.h, 12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = cycSel ? '#e8c24a'
                  : cycHover ? 'rgba(220,200,120,0.8)'
                  : 'rgba(110,130,160,0.35)';
  ctx.lineWidth = cycSel ? 3 : (cycHover ? 2 : 1.5);
  roundRect(ctx, r.cycle.x, r.cycle.y, r.cycle.w, r.cycle.h, 12);
  ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillStyle = cycSel ? '#f0d264' : (cycHover ? '#e0cc8a' : '#9fb0c6');
  ctx.fillText('🔄  CYCLE  [C]', r.cycle.x + r.cycle.w / 2, r.cycle.y + 20);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = cycSel ? '#c9a227' : '#5a6b80';
  ctx.fillText('Rotate season each level', r.cycle.x + r.cycle.w / 2, r.cycle.y + 36);

  var rndSel = G.seasonChoice === SEASON_RANDOM;
  var rndHover = pointInRect(mouse, r.random);

  ctx.save();
  if (rndSel) {
    var pulseR = 0.5 + 0.5 * Math.sin(performance.now() / 260);
    ctx.shadowColor = '#c084fc';
    ctx.shadowBlur = 10 + pulseR * 12;
  } else if (rndHover) {
    ctx.shadowColor = '#c084fc';
    ctx.shadowBlur = 8;
  }
  ctx.fillStyle = rndSel ? 'rgba(38,24,52,0.98)'
                 : rndHover ? 'rgba(30,20,42,0.98)'
                 : 'rgba(14,20,30,0.9)';
  roundRect(ctx, r.random.x, r.random.y, r.random.w, r.random.h, 12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = rndSel ? '#c084fc'
                  : rndHover ? 'rgba(200,150,240,0.8)'
                  : 'rgba(110,130,160,0.35)';
  ctx.lineWidth = rndSel ? 3 : (rndHover ? 2 : 1.5);
  roundRect(ctx, r.random.x, r.random.y, r.random.w, r.random.h, 12);
  ctx.stroke();
  ctx.restore();

  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillStyle = rndSel ? '#e8b4ff' : (rndHover ? '#d8a8f0' : '#9fb0c6');
  ctx.fillText('🎲  RANDOM  [R]', r.random.x + r.random.w / 2, r.random.y + 20);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = rndSel ? '#c084fc' : '#5a6b80';
  ctx.fillText('New season each level', r.random.x + r.random.w / 2, r.random.y + 36);

  var daySel = G.dayNightChoice === TOD_DAY;
  var dayHover = pointInRect(mouse, r.day);

  ctx.save();
  if (daySel) {
    var pulseD = 0.5 + 0.5 * Math.sin(performance.now() / 280);
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 10 + pulseD * 12;
  } else if (dayHover) {
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 8;
  }
  ctx.fillStyle = daySel ? 'rgba(48,40,16,0.98)'
                 : dayHover ? 'rgba(38,32,14,0.98)'
                 : 'rgba(14,20,30,0.9)';
  roundRect(ctx, r.day.x, r.day.y, r.day.w, r.day.h, 12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = daySel ? '#ffe066'
                  : dayHover ? 'rgba(255,224,102,0.75)'
                  : 'rgba(110,130,160,0.35)';
  ctx.lineWidth = daySel ? 3 : (dayHover ? 2 : 1.5);
  roundRect(ctx, r.day.x, r.day.y, r.day.w, r.day.h, 12);
  ctx.stroke();
  ctx.restore();

  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillStyle = daySel ? '#fff0a8' : (dayHover ? '#f0e090' : '#9fb0c6');
  ctx.fillText('☀  DAY  [D]', r.day.x + r.day.w / 2, r.day.y + 20);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = daySel ? '#c9a227' : '#5a6b80';
  ctx.fillText('Bright · +3 robbers/wave', r.day.x + r.day.w / 2, r.day.y + 36);

  var nightSel = G.dayNightChoice === TOD_NIGHT;
  var nightHover = pointInRect(mouse, r.night);

  ctx.save();
  if (nightSel) {
    var pulseN = 0.5 + 0.5 * Math.sin(performance.now() / 280);
    ctx.shadowColor = '#8fa0d0';
    ctx.shadowBlur = 10 + pulseN * 12;
  } else if (nightHover) {
    ctx.shadowColor = '#8fa0d0';
    ctx.shadowBlur = 8;
  }
  ctx.fillStyle = nightSel ? 'rgba(20,26,48,0.98)'
                 : nightHover ? 'rgba(16,22,40,0.98)'
                 : 'rgba(14,20,30,0.9)';
  roundRect(ctx, r.night.x, r.night.y, r.night.w, r.night.h, 12);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = nightSel ? '#8fa0d0'
                  : nightHover ? 'rgba(143,160,208,0.75)'
                  : 'rgba(110,130,160,0.35)';
  ctx.lineWidth = nightSel ? 3 : (nightHover ? 2 : 1.5);
  roundRect(ctx, r.night.x, r.night.y, r.night.w, r.night.h, 12);
  ctx.stroke();
  ctx.restore();

  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillStyle = nightSel ? '#cfdcee' : (nightHover ? '#c0cce0' : '#9fb0c6');
  ctx.fillText('🌙  NIGHT  [N]', r.night.x + r.night.w / 2, r.night.y + 20);
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = nightSel ? '#a8bbd2' : '#5a6b80';
  ctx.fillText('Dark · flashlight · stealth', r.night.x + r.night.w / 2, r.night.y + 36);

  var startHover = pointInRect(mouse, r.start);
  var blink = 0.55 + 0.45 * Math.sin(performance.now() / 320);
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = startHover ? 'rgba(180,255,180,1)' : 'rgba(126,224,129,' + blink + ')';
  ctx.fillText('PRESS SPACE TO START', W / 2, py + ph - 22);
  if (startHover) {
    ctx.save();
    ctx.strokeStyle = 'rgba(126,224,129,0.55)';
    ctx.lineWidth = 2;
    roundRect(ctx, r.start.x, r.start.y, r.start.w, r.start.h, 8);
    ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

function getShopRegions() {
  var pw = Math.min(760, W - 40);
  var ph = Math.min(500, H - 40);
  var px = W / 2 - pw / 2;
  var py = H / 2 - ph / 2;

  var cardW = Math.min(280, (pw - 80) / 2);
  var cardH = 230;
  var gap = 30;
  var totalW = cardW * 2 + gap;
  var startX = W / 2 - totalW / 2;
  var cardY = py + 165;

  var cards = [];
  for (var i = 0; i < 2; i++) {
    cards.push({ x: startX + i * (cardW + gap), y: cardY, w: cardW, h: cardH, index: i });
  }

  var skipW = 220, skipH = 44;
  var skipX = W / 2 - skipW / 2;
  var skipY = cardY + cardH + 26;

  return { cards: cards, skip: { x: skipX, y: skipY, w: skipW, h: skipH } };
}

function drawShopScreen() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.82)';
  ctx.fillRect(0, 0, W, H);

  var pw = Math.min(760, W - 40);
  var ph = Math.min(500, H - 40);
  var px = W / 2 - pw / 2;
  var py = H / 2 - ph / 2;
  panel(px, py, pw, ph);

  ctx.textAlign = 'center';
  ctx.font = 'bold 32px system-ui, sans-serif';
  ctx.fillStyle = '#7ee081';
  ctx.fillText('LEVEL ' + G.level + ' CLEARED', W / 2, py + 56);

  var todTag = G.timeOfDay === TOD_DAY ? 'Day' : 'Night';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = '#8fa0b8';
  ctx.fillText('+' + (15 + G.level * 5) + ' granola reward  |  next: ' + nextSeasonLabel() + ' ' + todTag, W / 2, py + 82);

  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillStyle = '#c9a227';
  ctx.fillText('You have: ' + G.granola + ' granola', W / 2, py + 114);

  ctx.font = '12px system-ui, sans-serif';
  ctx.fillStyle = '#7c8fa6';
  ctx.fillText('Costs rise 50% each time you buy the same upgrade.', W / 2, py + 138);

  var r = getShopRegions();

  for (var i = 0; i < 2; i++) {
    var card = r.cards[i];
    var item = G.shopChoices[i];
    var cost = getItemCost(item);
    var canAfford = item && G.granola >= cost;
    var hovered = pointInRect(mouse, card);
    var bought = item ? (G.purchaseCounts[item.id] || 0) : 0;

    ctx.save();
    if (hovered && canAfford) {
      ctx.shadowColor = '#7ee081';
      ctx.shadowBlur = 10;
    }

    ctx.fillStyle = (canAfford && hovered) ? 'rgba(24,42,30,0.98)'
                   : canAfford ? 'rgba(16,26,20,0.98)'
                   : 'rgba(14,18,24,0.9)';
    roundRect(ctx, card.x, card.y, card.w, card.h, 12);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = canAfford ? (hovered ? '#7ee081' : 'rgba(126,224,129,0.55)')
                                : 'rgba(110,130,160,0.3)';
    ctx.lineWidth = canAfford ? (hovered ? 3 : 2) : 1.5;
    roundRect(ctx, card.x, card.y, card.w, card.h, 12);
    ctx.stroke();
    ctx.restore();

    if (!item) continue;

    ctx.textAlign = 'center';
    ctx.font = '44px system-ui, "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.fillStyle = canAfford ? '#e8f0ff' : '#5a6b80';
    ctx.fillText(item.icon, card.x + card.w / 2, card.y + 62);

    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = canAfford ? '#e8f0ff' : '#5a6b80';
    ctx.fillText(item.name, card.x + card.w / 2, card.y + 100);

    ctx.font = '12.5px system-ui, sans-serif';
    ctx.fillStyle = canAfford ? '#9fb0c6' : '#4a5568';
    wrapText(item.desc, card.x + card.w / 2, card.y + 126, card.w - 30, 15);

    if (bought > 0) {
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillStyle = '#7a5a1a';
      ctx.fillText('base ' + item.cost + '  |  bought x' + bought, card.x + card.w / 2, card.y + card.h - 56);
    }

    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = canAfford ? '#c9a227' : '#7a5a1a';
    ctx.fillText('Cost: ' + cost, card.x + card.w / 2, card.y + card.h - 32);

    ctx.font = 'bold 11px system-ui, sans-serif';
    ctx.fillStyle = canAfford ? '#7ee081' : '#5a6b80';
    ctx.fillText('[ ' + (i + 1) + ' ]  click to buy', card.x + card.w / 2, card.y + card.h - 12);
  }

  var skipHover = pointInRect(mouse, r.skip);
  ctx.save();
  if (skipHover) { ctx.shadowColor = '#8fa0b8'; ctx.shadowBlur = 8; }
  ctx.fillStyle = skipHover ? 'rgba(30,38,52,0.98)' : 'rgba(16,22,32,0.95)';
  roundRect(ctx, r.skip.x, r.skip.y, r.skip.w, r.skip.h, 8);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = skipHover ? 'rgba(180,200,230,0.7)' : 'rgba(110,130,160,0.4)';
  ctx.lineWidth = skipHover ? 2.5 : 1.5;
  roundRect(ctx, r.skip.x, r.skip.y, r.skip.w, r.skip.h, 8);
  ctx.stroke();
  ctx.restore();

  ctx.textAlign = 'center';
  ctx.font = 'bold 15px system-ui, sans-serif';
  ctx.fillStyle = skipHover ? '#e6edf7' : '#9fb0c6';
  ctx.fillText('SKIP - build nothing', W / 2, r.skip.y + 28);

  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#4a5b70';
  ctx.fillText('Space / ESC = skip', W / 2, r.skip.y + r.skip.h + 18);

  ctx.restore();
}

function drawPlacementOverlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  var item = G.shopPicked;
  if (!item) return;

  var valid = canPlaceAt(mouse.x, mouse.y);
  var base = valid ? '126,224,129' : '224,75,90';

  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  ctx.globalAlpha = 0.85;

  if (item.id === 'turret') {
    ctx.fillStyle = 'rgba(' + base + ',0.28)';
    ctx.beginPath();
    ctx.arc(0, 0, 15, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(' + base + ',1)';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.fillStyle = 'rgba(' + base + ',0.7)';
    roundRect(ctx, 6, -4, 26, 8, 3);
    ctx.fill();
    ctx.strokeStyle = 'rgba(' + base + ',1)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = 'rgba(' + base + ',0.9)';
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, TAU);
    ctx.fill();
  } else if (item.id === 'barricade') {
    var r = 55;
    ctx.fillStyle = 'rgba(' + base + ',0.22)';
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(' + base + ',1)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    var n = 8;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * TAU;
      var rr = r * 0.72;
      var x = Math.cos(a) * rr;
      var y = Math.sin(a) * rr * 0.7;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(a + Math.PI / 2);
      ctx.fillStyle = 'rgba(' + base + ',0.55)';
      roundRect(ctx, -12, -6, 24, 12, 3);
      ctx.fill();
      ctx.strokeStyle = 'rgba(' + base + ',1)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  roundRect(ctx, W / 2 - 260, 20, 520, 76, 10);
  ctx.fill();

  ctx.font = 'bold 20px system-ui, "Segoe UI Emoji", "Apple Color Emoji", sans-serif';
  ctx.fillStyle = '#e6edf7';
  ctx.fillText(item.icon + '  Placing: ' + item.name, W / 2, 50);

  ctx.font = '13px system-ui, sans-serif';
  ctx.fillStyle = valid ? '#7ee081' : '#e04b5a';
  ctx.fillText(
    valid ? 'Click to place - Right-click or ESC to cancel'
          : 'Cannot place here - Right-click or ESC to cancel',
    W / 2, 76
  );

  ctx.font = 'bold 14px system-ui, sans-serif';
  ctx.fillStyle = '#c9a227';
  ctx.fillText('Cost: ' + getItemCost(item) + '  (you have ' + G.granola + ')', W / 2, 96);
  ctx.restore();
}

function drawGameOver() {
  var reason = G.gameOverReason;
  var title, subtitle;
  if (reason === 'stolen') {
    title = 'ALL GRANOLA STOLEN';
    subtitle = 'The robbers emptied the vault and slipped away.';
  } else if (reason === 'team') {
    title = 'NO DEFENDERS LEFT';
    subtitle = 'Everyone is down and nobody can afford a respawn.';
  } else {
    title = 'GAME OVER';
    subtitle = 'The night is over.';
  }

  ctx.save();
  ctx.fillStyle = 'rgba(20,0,0,0.78)';
  ctx.fillRect(0, 0, W, H);

  var pw = Math.min(560, W - 40);
  var ph = 380;
  var px = W / 2 - pw / 2;
  var py = H / 2 - ph / 2;
  panel(px, py, pw, ph);

  ctx.textAlign = 'center';
  ctx.font = 'bold 34px system-ui, sans-serif';
  ctx.fillStyle = '#e04b5a';
  ctx.fillText(title, W / 2, py + 70);

  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = '#8fa0b8';
  ctx.fillText(subtitle, W / 2, py + 100);

  ctx.font = 'bold 18px system-ui, sans-serif';
  ctx.fillStyle = '#c9a227';
  ctx.fillText(G.stats.stolen + ' granola stolen this run', W / 2, py + 140);

  ctx.font = '14px system-ui, sans-serif';
  ctx.fillStyle = G.stats.escaped > 0 ? '#e07a5a' : '#5a6b80';
  ctx.fillText('Escaped with the loot: ' + G.stats.escaped + ' granola', W / 2, py + 166);

  ctx.font = '15px system-ui, sans-serif';
  ctx.fillStyle = '#9fb0c6';
  ctx.fillText('Reached Level ' + G.level + ' - Wave ' + G.wave + '/' + G.wavesPerLevel, W / 2, py + 200);
  ctx.fillText('Robbers stopped: ' + G.stats.killed, W / 2, py + 224);

  ctx.font = 'bold 16px system-ui, sans-serif';
  var pulse = 0.55 + 0.45 * Math.sin(performance.now() / 350);
  ctx.fillStyle = 'rgba(230,240,255,' + pulse + ')';
  ctx.fillText('PRESS SPACE FOR MENU', W / 2, py + ph - 40);

  ctx.restore();
}

function drawPaused() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 44px system-ui, sans-serif';
  ctx.fillStyle = '#dfe7f2';
  ctx.fillText('PAUSED', W / 2, H / 2);
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillStyle = '#7c8fa6';
  ctx.fillText('Press P to resume', W / 2, H / 2 + 36);
  ctx.restore();
}

function wrapText(text, cx, y, maxW, lineH) {
  var words = text.split(' ');
  var line = '';
  var yy = y;
  for (var i = 0; i < words.length; i++) {
    var w = words[i];
    var test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, cx, yy);
      line = w;
      yy += lineH;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, cx, yy);
}

/* =========================================================
   LOOP
   ========================================================= */

var lastT = performance.now();

function updateCursorStyle() {
  var menuLike = G.state === 'menu' || G.state === 'season' ||
                 G.state === 'shop' || G.state === 'place' ||
                 G.state === 'gameover';
  canvas.style.cursor = menuLike ? 'default' : 'none';
}

function loop(t) {
  var dt = Math.min((t - lastT) / 1000, 0.05);
  lastT = t;

  G.time += dt;
  update(dt);
  render();
  updateCursorStyle();

  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
</script>
