<!DOCTYPE html>

<body>
<canvas id="game"></canvas>
<div id="hint">P = pause / field shop | R = reload / respawn P1 | E = P1 eat | M = P2 eat / respawn | F or RMB = punch</div>
<script>
"use strict";

/* =========================================================
   GRANOLA BANK DEFENCE
   ========================================================= */

var canvas = document.getElementById('game');
var ctx    = canvas.getContext('2d');
var lightCanvas = document.createElement('canvas');
var lctx   = lightCanvas.getContext('2d');

var W = 1280, H = 720;

var RESPAWN_COST       = 50;
var STEAL_AMOUNT       = 10;
var STEAL_AMOUNT_BRUTE = 20;
var REPAIR_COST        = 200;

var SEASON_CYCLE  = -1;
var SEASON_RANDOM = -2;

var TOD_DAY    = 'day';
var TOD_NIGHT  = 'night';
var TOD_CHANGE = 'change';

/* =========================================================
   META PROGRESSION
   ========================================================= */

/* CHEAPER ARMORY PRICES */
var GUNS = {
  pistol:  { id: 'pistol',  name: 'Pistol',  icon: '🔫', dmg: 1, cd: 0.11, pellets: 1, spread: 0.028, price: 0,   desc: 'Standard sidearm. Reliable.' },
  smg:     { id: 'smg',     name: 'SMG',     icon: '💨', dmg: 1, cd: 0.06, pellets: 1, spread: 0.075, price: 30,  desc: 'Fires very fast with loose spread.' },
  rifle:   { id: 'rifle',   name: 'Rifle',   icon: '🎯', dmg: 2, cd: 0.24, pellets: 1, spread: 0.006, price: 50,  desc: 'High damage, pinpoint accuracy, slow.' },
  shotgun: { id: 'shotgun', name: 'Shotgun', icon: '💥', dmg: 1, cd: 0.45, pellets: 5, spread: 0.24,  price: 75,  desc: '5 pellets per shot. Devastating up close.' }
};

var META = {
  money: 0,
  gun: 'pistol',
  unlockedGuns: { pistol: true },
  damageTier: 0,
  fireRateTier: 0
};

/* CHEAPER UPGRADE TIERS */
var DMG_TIER_COSTS = [20, 45, 90];
var ROF_TIER_COSTS = [18, 40, 85];
var DMG_PER_TIER   = 1;
var ROF_PER_TIER   = 0.08;

function metaDamageBonus() { return META.damageTier * DMG_PER_TIER; }
function metaFireRateMult() { return Math.pow(1 - ROF_PER_TIER, META.fireRateTier); }

function loadMeta() {
  try {
    var saved = localStorage.getItem('granolaMeta_v1');
    if (saved) {
      var parsed = JSON.parse(saved);
      if (typeof parsed.money === 'number') META.money = parsed.money;
      if (typeof parsed.gun === 'string' && GUNS[parsed.gun]) META.gun = parsed.gun;
      if (parsed.unlockedGuns) META.unlockedGuns = parsed.unlockedGuns;
      if (typeof parsed.damageTier === 'number') META.damageTier = Math.min(3, Math.max(0, parsed.damageTier));
      if (typeof parsed.fireRateTier === 'number') META.fireRateTier = Math.min(3, Math.max(0, parsed.fireRateTier));
      META.unlockedGuns.pistol = true;
      if (!META.unlockedGuns[META.gun]) META.gun = 'pistol';
    }
  } catch (e) {}
}
function saveMeta() {
  try { localStorage.setItem('granolaMeta_v1', JSON.stringify(META)); } catch (e) {}
}

/* ---------- helpers ---------- */
function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.floor(rand(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }
var TAU = Math.PI * 2;

function distToSegment(px, py, x1, y1, x2, y2) {
  var dx = x2 - x1, dy = y2 - y1;
  var lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(px - x1, py - y1);
  var t = ((px - x1) * dx + (py - y1) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

function roundRect(c, x, y, w, h, r) {
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function pointInRect(p, r) {
  if (!r) return false;
  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

/* =========================================================
   AUDIO
   ========================================================= */

var audioCtx = null;
function unlockAudio() {
  if (audioCtx) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  } catch (e) { audioCtx = null; }
}

function playBeep(freqStart, freqEnd, duration, volume, type) {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') { try { audioCtx.resume(); } catch (e) {} }
  try {
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.type = type || 'sawtooth';
    osc.frequency.setValueAtTime(freqStart, t);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + duration);
    gain.gain.setValueAtTime(volume, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration + 0.02);
  } catch (e) {}
}

function playHurtSound() {
  playBeep(280, 70, 0.22, 0.20, 'sawtooth');
  playBeep(120, 55, 0.28, 0.14, 'square');
}
function playPlayerDownSound() {
  playBeep(400, 40, 0.6, 0.25, 'sawtooth');
  playBeep(200, 30, 0.7, 0.18, 'square');
}
function playBuySound() {
  playBeep(500, 800, 0.12, 0.15, 'sine');
  playBeep(800, 1200, 0.15, 0.12, 'sine');
}
function playWaveSound() {
  playBeep(400, 600, 0.15, 0.12, 'sine');
  playBeep(600, 900, 0.18, 0.10, 'sine');
}
function playMagnetSound() {
  playBeep(200, 1400, 0.4, 0.20, 'sine');
  playBeep(100, 800, 0.5, 0.15, 'triangle');
}

/* =========================================================
   SEASONS  —  NEW ORDER: Spring, Summer, Autumn, Winter
   ========================================================= */

var SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];

var SEASON_INFO = [
  { name: 'Spring', icon: '🍃', color: '#7ee081',
    playerPerk: 'Leaf Shield: falling leaves stun robbers 2.5s',
    robberPerk: 'Spring Bloom: each wave spawns +3 extra robbers' },
  { name: 'Summer', icon: '☀', color: '#f0c040',
    playerPerk: 'None — normal conditions',
    robberPerk: 'None — standard raiders' },
  { name: 'Autumn', icon: '🍂', color: '#d9803a',
    playerPerk: 'Harvest Bounty: granola drops give +60%',
    robberPerk: 'Night Ambush: 85% of robbers hide in the dark' },
  { name: 'Winter', icon: '❄', color: '#8fd4ff',
    playerPerk: 'Bright Night: +30% flashlight, brighter map',
    robberPerk: 'Frozen Fury: robbers get +2 HP' }
];

function seasonVisionMult() {
  if (G.timeOfDay === TOD_DAY) return 1.00;
  if (G.season === 'Winter') return 1.30;
  if (G.season === 'Autumn') return 0.55;
  return 1.00;
}
function seasonDarkness() {
  if (G.season === 'Summer') return 0.90;
  if (G.season === 'Winter') return 0.80;
  if (G.season === 'Autumn') return 0.96;
  if (G.season === 'Spring') return 0.88;
  return 0.90;
}
function seasonRobberSpeedMult() { if (G.season === 'Autumn') return 1.05; return 1.00; }
function seasonPlayerSpeedMult() { if (G.season === 'Autumn') return 0.95; return 1.00; }
function robberMaxHp() { var hp = 5 + (G.level - 1); if (G.season === 'Winter') hp += 2; return hp; }
function bruteSpawnChance() { if (G.level < 3) return 0; return Math.min(0.30, 0.05 + (G.level - 2) * 0.04); }

/* =========================================================
   STATE
   ========================================================= */

var G = {
  state: 'menu',
  mode: 1,
  seasonChoice: SEASON_CYCLE,
  dayNightChoice: TOD_NIGHT,
  lastRandomSeason: -1,
  level: 1,
  wave: 0,
  wavesPerLevel: 3,
  season: 'Spring',
  timeOfDay: TOD_NIGHT,
  time: 0,
  gameOverReason: 'stolen',
  gameOverPlayerId: -1,
  earnedMoney: 0,

  bank: null,
  players: [],
  robbers: [],
  bullets: [],
  pickups: [],
  particles: [],
  leaves: [],
  flashes: [],
  decor: [],

  turrets: [],
  barricades: [],
  turretDmgBonus: 0,
  turretSpeedMult: 1,
  turretRangeBonus: 0,

  playerDmgBonus: 0,
  playerFireRateMult: 1,

  granola: 0,
  peakGranola: 0,

  shopChoices: [],
  shopPicked: null,
  purchaseCounts: {},
  placeAnchor: null,

  spawnLeft: 0,
  spawnTimer: 0,
  waveDelay: 0,
  bruteAnnounced: false,

  /* Wave bonus banner */
  waveBanner: '',
  waveBannerT: 0,
  waveBannerMax: 2.5,

  shake: 0,
  stats: { killed: 0, stolen: 0, escaped: 0, magnetsUsed: 0 },

  damageFlash: 0,
  damageVignette: 0,
  hitStop: 0,
  damageNumbers: [],
  lastHurtPlayerId: -1,
  heartFlash: 0,
  lowHealthPulse: 0
};

/* =========================================================
   INPUT
   ========================================================= */

var keys  = Object.create(null);
var mouse = { x: W / 2, y: H / 2, down: false };

function canvasPos(e) {
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function normalizeKey(e) {
  var code = e.code;
  if (code) {
    if (code.indexOf('Key') === 0)   return code[3].toLowerCase();
    if (code.indexOf('Digit') === 0) return code[5];
    if (code.indexOf('Arrow') === 0) return code.toLowerCase();
    if (code === 'Space')  return ' ';
    if (code === 'Escape') return 'escape';
  }
  return e.key ? e.key.toLowerCase() : '';
}

addEventListener('keydown', function (e) {
  unlockAudio();
  var k = normalizeKey(e);
  if (k) keys[k] = true;
  if (k === ' ' || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') {
    e.preventDefault();
  }

  if (G.state === 'menu') {
    if (k === '1') { G.mode = 1; G.state = 'season'; }
    if (k === '2') { G.mode = 2; G.state = 'season'; }
    if (k === 'a') { G.state = 'armory'; }
    return;
  }
  if (G.state === 'armory') { if (k === 'escape') { G.state = 'menu'; } return; }

  if (G.state === 'season') {
    if (k === '1') G.seasonChoice = 0;
    if (k === '2') G.seasonChoice = 1;
    if (k === '3') G.seasonChoice = 2;
    if (k === '4') G.seasonChoice = 3;
    if (k === 'c') G.seasonChoice = SEASON_CYCLE;
    if (k === 'r' || k === '5') G.seasonChoice = SEASON_RANDOM;
    if (k === 'd') G.dayNightChoice = TOD_DAY;
    if (k === 'n') G.dayNightChoice = TOD_NIGHT;
    if (k === 'a') G.dayNightChoice = TOD_CHANGE;
    if (k === 'arrowleft') {
      if (G.seasonChoice === SEASON_RANDOM) G.seasonChoice = 3;
      else if (G.seasonChoice === SEASON_CYCLE) G.seasonChoice = SEASON_RANDOM;
      else if (G.seasonChoice <= 0) G.seasonChoice = SEASON_CYCLE;
      else G.seasonChoice = G.seasonChoice - 1;
    }
    if (k === 'arrowright') {
      if (G.seasonChoice === 3) G.seasonChoice = SEASON_CYCLE;
      else if (G.seasonChoice === SEASON_CYCLE) G.seasonChoice = SEASON_RANDOM;
      else if (G.seasonChoice === SEASON_RANDOM) G.seasonChoice = 0;
      else G.seasonChoice = G.seasonChoice + 1;
    }
    if (k === ' ' || k === 'enter') startGame(G.mode);
    if (k === 'escape') G.state = 'menu';
    return;
  }

  if (G.state === 'shop') {
    if (k === 'escape' || k === ' ') { nextLevel(); return; }
    var it0 = G.shopChoices[0];
    var it1 = G.shopChoices[1];
    if (k === '1' && it0 && G.granola >= getItemCost(it0)) pickShopItem(it0);
    if (k === '2' && it1 && G.granola >= getItemCost(it1)) pickShopItem(it1);
    return;
  }

  if (G.state === 'place') {
    if (k === 'escape') { G.state = 'shop'; G.shopPicked = null; G.placeAnchor = null; }
    return;
  }

  if (G.state === 'gameover') {
    if (k === ' ' || k === 'enter') G.state = 'menu';
    if (k === 'a') { G.state = 'armory'; }
    return;
  }

  if (k === 'p' || (k === 'escape' && G.state === 'play')) { togglePause(); return; }
  if (k === 'escape' && G.state === 'paused') { G.state = 'play'; return; }
  if (G.state !== 'play') return;

  var p1 = G.players[0];
  var p2 = G.players[1];

  if (k === 'r') {
    if (p1 && p1.down) tryRespawn(p1);
    else tryReload(p1);
  }
  if (k === 'e') eatGranola(p1);
  if (k === 'f') punch(p1);
  if (k === 'm' && p2) {
    if (p2.down) tryRespawn(p2);
    else eatGranola(p2);
  }
});

addEventListener('keyup', function (e) {
  var k = normalizeKey(e);
  if (k) keys[k] = false;
});

canvas.addEventListener('mousemove', function (e) {
  var p = canvasPos(e);
  mouse.x = p.x; mouse.y = p.y;
});

canvas.addEventListener('mousedown', function (e) {
  unlockAudio();
  var p = canvasPos(e);
  mouse.x = p.x; mouse.y = p.y;

  if (G.state === 'menu') {
    if (e.button !== 0) return;
    var r = getMenuRegions();
    if (pointInRect(p, r.p1)) { G.mode = 1; G.state = 'season'; return; }
    if (pointInRect(p, r.p2)) { G.mode = 2; G.state = 'season'; return; }
    if (pointInRect(p, r.armory)) { G.state = 'armory'; return; }
    return;
  }
  if (G.state === 'armory') { if (e.button === 0) handleArmoryClick(p); return; }

  if (G.state === 'season') {
    if (e.button !== 0) return;
    var rs = getSeasonRegions();
    for (var i = 0; i < rs.cards.length; i++) {
      if (pointInRect(p, rs.cards[i])) { G.seasonChoice = rs.cards[i].index; return; }
    }
    if (pointInRect(p, rs.cycle))  { G.seasonChoice = SEASON_CYCLE; return; }
    if (pointInRect(p, rs.random)) { G.seasonChoice = SEASON_RANDOM; return; }
    if (pointInRect(p, rs.day))    { G.dayNightChoice = TOD_DAY; return; }
    if (pointInRect(p, rs.night))  { G.dayNightChoice = TOD_NIGHT; return; }
    if (pointInRect(p, rs.change)) { G.dayNightChoice = TOD_CHANGE; return; }
    if (pointInRect(p, rs.start))  { startGame(G.mode); return; }
    return;
  }

  if (G.state === 'shop') {
    if (e.button !== 0) return;
    var rsh = getShopRegions();
    for (var j = 0; j < rsh.cards.length; j++) {
      if (pointInRect(p, rsh.cards[j])) {
        var item = G.shopChoices[rsh.cards[j].index];
        if (item && G.granola >= getItemCost(item)) pickShopItem(item);
        return;
      }
    }
    if (pointInRect(p, rsh.skip)) { nextLevel(); return; }
    return;
  }

  if (G.state === 'place') {
    if (e.button === 2) {
      if (G.placeAnchor) G.placeAnchor = null;
      else { G.state = 'shop'; G.shopPicked = null; }
      return;
    }
    if (e.button === 0) {
      var it = G.shopPicked;
      if (!it) return;
      if (it.id === 'barricade') {
        if (!G.placeAnchor) {
          if (canPlaceBarricadePoint(p.x, p.y)) G.placeAnchor = { x: p.x, y: p.y };
        } else {
          var ax = G.placeAnchor.x, ay = G.placeAnchor.y;
          var len = dist(ax, ay, p.x, p.y);
          if (len >= 40 && len <= 280 && canPlaceBarricadeLine(ax, ay, p.x, p.y)) {
            confirmPlacementLine(ax, ay, p.x, p.y);
          }
        }
      } else {
        if (canPlaceAt(p.x, p.y)) confirmPlacement(p.x, p.y);
      }
    }
    return;
  }

  if (G.state === 'gameover') {
    if (e.button !== 0) return;
    var rgo = getGameOverRegions();
    if (pointInRect(p, rgo.menu))   { G.state = 'menu'; return; }
    if (pointInRect(p, rgo.armory)) { G.state = 'armory'; return; }
    return;
  }

  if (G.state === 'paused') {
    if (e.button !== 0) return;
    handlePauseClick(p);
    return;
  }

  if (G.state === 'play' && e.button === 0) {
    for (var k = 0; k < G.players.length; k++) {
      var pl = G.players[k];
      var rr = getRespawnRegion(pl);
      if (rr && pointInRect(p, rr)) { tryRespawn(pl); return; }
    }
    mouse.down = true;
  }
  if (e.button === 2 && G.state === 'play') punch(G.players[0]);
});

addEventListener('mouseup', function (e) { if (e.button === 0) mouse.down = false; });
canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
addEventListener('blur', function () {
  mouse.down = false;
  for (var k in keys) keys[k] = false;
});

/* =========================================================
   RESIZE
   ========================================================= */

function resize() {
  W = canvas.width = lightCanvas.width = window.innerWidth;
  H = canvas.height = lightCanvas.height = window.innerHeight;
  if (G.bank) { G.bank.x = W / 2; G.bank.y = H / 2; }
  mouse.x = clamp(mouse.x, 0, W);
  mouse.y = clamp(mouse.y, 0, H);
}
addEventListener('resize', resize);

/* =========================================================
   PLAYER
   ========================================================= */

function makePlayer(id, x, y) {
  return {
    id: id, x: x, y: y, r: 13,
    hp: 3, maxHp: 10,
    reserve: 20, clip: 10, clipSize: 10,
    angle: -Math.PI / 2,
    vx: 0, vy: 0,
    fireCd: 0, punchCd: 0, reloadT: 0, invuln: 0, muzzle: 0, recoil: 0, punchAnim: 0,
    hurtFlash: 0,
    autoAim: id === 1,
    down: false, downT: 0,
    color: id === 0 ? '#5fd1ff' : '#ffd45f',
    dark:  id === 0 ? '#1d6f96' : '#a8802a'
  };
}

/* =========================================================
   LEVEL FLOW
   ========================================================= */

function startGame(mode) {
  G.mode = mode;
  G.level = 1;
  G.granola = 0;
  G.peakGranola = 0;
  G.turrets = [];
  G.barricades = [];
  G.turretDmgBonus = 0;
  G.turretSpeedMult = 1;
  G.turretRangeBonus = 0;
  G.playerDmgBonus = 0;
  G.playerFireRateMult = 1;
  G.stats = { killed: 0, stolen: 0, escaped: 0, magnetsUsed: 0 };
  G.gameOverReason = 'stolen';
  G.gameOverPlayerId = -1;
  G.earnedMoney = 0;
  G.shopChoices = [];
  G.shopPicked = null;
  G.placeAnchor = null;
  G.purchaseCounts = {};
  G.lastRandomSeason = -1;
  G.damageFlash = 0;
  G.damageVignette = 0;
  G.hitStop = 0;
  G.damageNumbers = [];
  G.lastHurtPlayerId = -1;
  G.heartFlash = 0;
  G.lowHealthPulse = 0;
  G.waveBanner = '';
  G.waveBannerT = 0;

  G.bank = {
    x: W / 2, y: H / 2, w: 132, h: 92,
    maxHp: 30, hp: 30, regen: 1.5,
    bonusHp: 0, breached: false, granola: 0, hitFlash: 0
  };

  G.players = [ makePlayer(0, W / 2 - 130, H / 2 + 150) ];
  if (mode === 2) G.players.push(makePlayer(1, W / 2 + 130, H / 2 + 150));

  G.state = 'play';
  startLevel();
}

function pickSeason() {
  if (G.seasonChoice === SEASON_RANDOM) {
    var idx;
    if (G.lastRandomSeason >= 0 && SEASONS.length > 1) {
      var roll = randi(0, SEASONS.length - 2);
      if (roll >= G.lastRandomSeason) roll++;
      idx = roll;
    } else idx = randi(0, SEASONS.length - 1);
    G.lastRandomSeason = idx;
    return SEASONS[idx];
  }
  if (G.seasonChoice === SEASON_CYCLE) return SEASONS[(G.level - 1) % 4];
  if (G.seasonChoice >= 0 && G.seasonChoice < SEASONS.length) return SEASONS[G.seasonChoice];
  return SEASONS[0];
}

/* === Time of day — CYCLE now uses 4-level blocks to match the 4 seasons === */
function pickTimeOfDay() {
  if (G.dayNightChoice === TOD_DAY)   return TOD_DAY;
  if (G.dayNightChoice === TOD_NIGHT) return TOD_NIGHT;
  if (G.seasonChoice === SEASON_RANDOM) return Math.random() < 0.5 ? TOD_DAY : TOD_NIGHT;
  if (G.seasonChoice === SEASON_CYCLE) {
    /* 4 levels of one time-of-day, then 4 of the other — matches the 4-season cycle */
    var cycleIndex = Math.floor((G.level - 1) / 4);
    return (cycleIndex % 2 === 0) ? TOD_NIGHT : TOD_DAY;
  }
  /* Fixed season → flip every level */
  return (G.level % 2 === 1) ? TOD_NIGHT : TOD_DAY;
}

function startLevel() {
  G.season = pickSeason();
  G.timeOfDay = pickTimeOfDay();
  G.wave = 0;
  G.bank.maxHp = 30 + 5 * (G.level - 1) + (G.bank.bonusHp || 0);
  G.bank.hp = G.bank.maxHp;
  G.bank.breached = false;
  G.robbers.length = 0;
  G.bullets.length = 0;
  G.pickups.length = 0;
  G.particles.length = 0;
  G.leaves.length = 0;
  G.bruteAnnounced = false;
  G.damageNumbers.length = 0;
  G.damageFlash = 0;
  G.damageVignette = 0;
  for (var i = 0; i < G.players.length; i++) {
    var p = G.players[i];
    p.x = G.bank.x + (p.id === 0 ? -130 : 130);
    p.y = G.bank.y + 150;
    p.hp = Math.max(p.hp, 3);
    p.down = false;
    p.clip = p.clipSize;
    p.reloadT = 0;
    p.invuln = 1.5;
    p.hurtFlash = 0;
  }
  makeDecor();
  startWave();
}

function startWave() {
  G.wave++;
  var extra = 0;
  if (G.season === 'Spring') extra += 3;
  if (G.timeOfDay === TOD_DAY) extra += 3;
  G.spawnLeft = 2 + G.level * 2 + extra;
  G.spawnTimer = 1.0;
  G.waveDelay = 0;
}

/* === WAVE BONUS === */
function applyWaveBonus() {
  var roll = randi(0, 2);
  if (roll === 0) {
    /* Ammo refill */
    for (var i = 0; i < G.players.length; i++) {
      if (G.players[i].down) continue;
      G.players[i].reserve = Math.min(60, G.players[i].reserve + 8);
      G.players[i].clip = G.players[i].clipSize;
      G.players[i].reloadT = 0;
    }
    showWaveBanner('⚡ WAVE BONUS: +8 AMMO & FULL CLIP');
  } else if (roll === 1) {
    /* Small heal */
    var healed = false;
    for (var j = 0; j < G.players.length; j++) {
      if (G.players[j].down) continue;
      if (G.players[j].hp < G.players[j].maxHp) {
        G.players[j].hp++;
        healed = true;
        for (var k = 0; k < 12; k++) {
          G.particles.push({
            x: G.players[j].x, y: G.players[j].y,
            vx: rand(-80, 80), vy: rand(-140, -30),
            life: 0.8, max: 0.8, color: '#7ee081', size: 3
          });
        }
      }
    }
    if (healed) showWaveBanner('❤ WAVE BONUS: +1 HP');
    else {
      G.granola += 12;
      showWaveBanner('🌾 WAVE BONUS: +12 GRANOLA');
    }
  } else {
    /* Shared granola */
    G.granola += 15;
    showWaveBanner('🌾 WAVE BONUS: +15 GRANOLA');
  }
  playWaveSound();
}

function showWaveBanner(text) {
  G.waveBanner = text;
  G.waveBannerT = G.waveBannerMax;
}

/* === AUTO-COLLECT ALL PICKUPS === */
function collectAllPickups(sourcePlayer) {
  var p = sourcePlayer || G.players[0];
  var collected = 0;
  for (var i = G.pickups.length - 1; i >= 0; i--) {
    var pk = G.pickups[i];
    if (pk.type === 'granola') {
      G.granola += (pk.amount || 5);
      collected++;
    } else if (pk.type === 'ammo') {
      p.reserve = Math.min(60, p.reserve + (pk.amount || 10));
      collected++;
    } else if (pk.type === 'magnet') {
      /* skip — no double magnets */
      continue;
    }
    /* Trail particle effect flying to the player */
    for (var k = 0; k < 4; k++) {
      G.particles.push({
        x: pk.x, y: pk.y,
        vx: rand(-100, 100), vy: rand(-100, 100),
        life: 0.5, max: 0.5,
        color: pk.type === 'granola' ? '#c9a227' : '#ffd94a',
        size: 3
      });
    }
    G.pickups.splice(i, 1);
  }
  return collected;
}

/* === MAGNET USE === */
function useMagnet(sourcePlayer) {
  G.stats.magnetsUsed++;
  playMagnetSound();
  collectAllPickups(sourcePlayer);
  /* Big visual flash */
  if (sourcePlayer) {
    G.flashes.push({ x: sourcePlayer.x, y: sourcePlayer.y, r: 500, life: 0.6, max: 0.6 });
  } else if (G.bank) {
    G.flashes.push({ x: G.bank.x, y: G.bank.y, r: 500, life: 0.6, max: 0.6 });
  }
  showWaveBanner('🧲 MAGNET! Collected everything');
}

function levelComplete() {
  /* === Magnet used at level end — auto-collect all pickups === */
  useMagnet(null);
  var reward = 15 + G.level * 5;
  G.granola += reward;
  rollShop();
  G.state = 'shop';
}

function nextLevel() {

  G.shopPicked = null;
  G.placeAnchor = null;

function nextSeasonLabel() {
  if (G.seasonChoice === SEASON_RANDOM) return 'RANDOM';
  if (G.seasonChoice === SEASON_CYCLE)  return SEASONS[G.level % 4];
  if (G.seasonChoice >= 0)              return SEASONS[G.seasonChoice];
  return SEASONS[0];
}
function nextTimeOfDayLabel() {
  if (G.dayNightChoice === TOD_DAY)   return 'Day';
  if (G.dayNightChoice === TOD_NIGHT) return 'Night';
  if (G.seasonChoice === SEASON_RANDOM) return 'Random';
  var nextLevel = G.level + 1;
  if (G.seasonChoice === SEASON_CYCLE) {
    var ci = Math.floor((nextLevel - 1) / 4);   /* 4-level blocks */
    return (ci % 2 === 0) ? 'Night' : 'Day';
  }
  return (nextLevel % 2 === 1) ? 'Night' : 'Day';
}
function seasonModeLabel() {
  if (G.seasonChoice === SEASON_RANDOM) return 'RANDOM';
  if (G.seasonChoice === SEASON_CYCLE)  return 'CYCLE';
  if (G.seasonChoice >= 0)              return SEASONS[G.seasonChoice].toUpperCase();

  if (G.dayNightChoice === TOD_NIGHT) return 'NIGHT';

}
function changeSubtitle() {

  if (G.seasonChoice === SEASON_CYCLE)  return 'Flips every 4 seasons';
  return 'Flips every level';

function getItemCost(item) {
  if (!item) return 0;
  var times = G.purchaseCounts[item.id] || 0;
  return Math.round(item.cost * (1 + 0.5 * times));
}

function rollShop() {
  G.shopChoices = [];
  var pool = BUILD_CATALOG.slice();
  for (var i = 0; i < 2 && pool.length > 0; i++) {
    var idx = randi(0, pool.length - 1);
    G.shopChoices.push(pool[idx]);
    pool.splice(idx, 1);
  }
}

function pickShopItem(item) {
  if (!item) return;
  var cost = getItemCost(item);
  if (G.granola < cost) return;
  G.shopPicked = item;
  if (item.placeable) { G.state = 'place'; G.placeAnchor = null; }
  else {
    G.granola -= cost;
    G.purchaseCounts[item.id] = (G.purchaseCounts[item.id] || 0) + 1;
    item.place();
    nextLevel();
  }
}

function confirmPlacement(x, y) {
  var item = G.shopPicked;
  if (!item || !canPlaceAt(x, y)) return;
  var cost = getItemCost(item);
  if (G.granola < cost) { G.state = 'shop'; G.shopPicked = null; return; }
  G.granola -= cost;
  G.purchaseCounts[item.id] = (G.purchaseCounts[item.id] || 0) + 1;
  item.place(x, y);
  G.placeAnchor = null;
  nextLevel();
}

function confirmPlacementLine(x1, y1, x2, y2) {
  var item = G.shopPicked;
  if (!item) return;
  var cost = getItemCost(item);
  if (G.granola < cost) { G.state = 'shop'; G.shopPicked = null; G.placeAnchor = null; return; }
  G.granola -= cost;
  G.purchaseCounts[item.id] = (G.purchaseCounts[item.id] || 0) + 1;
  item.place(x1, y1, x2, y2);
  G.placeAnchor = null;
  nextLevel();
}

function canPlaceAt(x, y) {
  if (x < 50 || x > W - 50 || y < 50 || y > H - 50) return false;
  if (G.bank) {
    var b = G.bank;
    if (x > b.x - b.w / 2 - 30 && x < b.x + b.w / 2 + 30 &&
        y > b.y - b.h / 2 - 30 && y < b.y + b.h / 2 + 30) return false;
  }
  var i;
  for (i = 0; i < G.turrets.length; i++) {
    if (dist(x, y, G.turrets[i].x, G.turrets[i].y) < 50) return false;
  }
  for (i = 0; i < G.barricades.length; i++) {
    if (distToSegment(x, y, G.barricades[i].x1, G.barricades[i].y1, G.barricades[i].x2, G.barricades[i].y2) < 36) return false;
  }
  for (i = 0; i < G.players.length; i++) {
    if (dist(x, y, G.players[i].x, G.players[i].y) < 40) return false;
  }
  return true;
}

function canPlaceBarricadePoint(x, y) {
  if (x < 50 || x > W - 50 || y < 50 || y > H - 50) return false;
  if (G.bank) {
    var b = G.bank;
    if (x > b.x - b.w / 2 - 30 && x < b.x + b.w / 2 + 30 &&
        y > b.y - b.h / 2 - 30 && y < b.y + b.h / 2 + 30) return false;
  }
  for (var i = 0; i < G.players.length; i++) {
    if (dist(x, y, G.players[i].x, G.players[i].y) < 30) return false;
  }
  return true;
}

function canPlaceBarricadeLine(x1, y1, x2, y2) {
  var steps = Math.max(4, Math.floor(dist(x1, y1, x2, y2) / 20));
  for (var s = 0; s <= steps; s++) {
    var t = s / steps;
    var sx = x1 + (x2 - x1) * t;
    var sy = y1 + (y2 - y1) * t;
    if (sx < 40 || sx > W - 40 || sy < 40 || sy > H - 40) return false;
    if (G.bank) {
      var b = G.bank;
      if (sx > b.x - b.w / 2 - 25 && sx < b.x + b.w / 2 + 25 &&
          sy > b.y - b.h / 2 - 25 && sy < b.y + b.h / 2 + 25) return false;
    }
    for (var i = 0; i < G.turrets.length; i++) {
      if (dist(sx, sy, G.turrets[i].x, G.turrets[i].y) < 35) return false;
    }
    for (var j = 0; j < G.barricades.length; j++) {
      if (distToSegment(sx, sy, G.barricades[j].x1, G.barricades[j].y1, G.barricades[j].x2, G.barricades[j].y2) < 36) return false;
    }
  }
  for (var p = 0; p < G.players.length; p++) {
    if (distToSegment(G.players[p].x, G.players[p].y, x1, y1, x2, y2) < 30) return false;
  }
  return true;
}

/* =========================================================
   COLLISION WITH BANK
   ========================================================= */

function collideWithBank(p) {
  if (!G.bank) return;
  var b = G.bank;
  var hw = b.w / 2;
  var hh = b.h / 2;
  var dx = p.x - b.x, dy = p.y - b.y;
  var cx = clamp(dx, -hw, hw);
  var cy = clamp(dy, -hh, hh);
  var ddx = dx - cx, ddy = dy - cy;
  var d = Math.hypot(ddx, ddy);
  if (d < p.r) {
    if (d < 0.001) {
      var overlapX = hw - Math.abs(dx);
      var overlapY = hh - Math.abs(dy);
      if (overlapX < overlapY) p.x = b.x + (dx >= 0 ? 1 : -1) * (hw + p.r + 0.5);
      else p.y = b.y + (dy >= 0 ? 1 : -1) * (hh + p.r + 0.5);
    } else {
      var push = p.r - d + 0.5;
      p.x += (ddx / d) * push;
      p.y += (ddy / d) * push;
    }
  }
}

function tryReload(p) {
  if (!p || p.down) return;
  if (p.reloadT > 0 || p.clip >= p.clipSize || p.reserve <= 0) return;
  p.reloadT = 1.1;
}

function eatGranola(p) {
  if (!p || p.down) return;
  if (G.granola >= 5 && p.hp < p.maxHp) {
    G.granola -= 5;
    p.hp++;
    for (var i = 0; i < 10; i++) {
      G.particles.push({
        x: p.x, y: p.y, vx: rand(-60, 60), vy: rand(-90, -20),
        life: 0.7, max: 0.7, color: '#7ee081', size: 3
      });
    }
  }
}

function currentGun() { return GUNS[META.gun] || GUNS.pistol; }

function shoot(p) {
  if (p.fireCd > 0 || p.reloadT > 0 || p.down) return;
  if (p.clip <= 0) { tryReload(p); return; }
  var gun = currentGun();
  var baseDmg = gun.dmg + G.playerDmgBonus + metaDamageBonus();
  var baseCd = p.autoAim ? (gun.cd * 2.8) : gun.cd;
  var cd = baseCd * G.playerFireRateMult * metaFireRateMult();

  p.clip--;
  p.fireCd = cd;
  p.recoil = 1;
  p.muzzle = 0.055;
  p.vx -= Math.cos(p.angle) * 14;
  p.vy -= Math.sin(p.angle) * 14;

  for (var i = 0; i < gun.pellets; i++) {
    var a = p.angle + rand(-gun.spread, gun.spread);
    var sx = p.x + Math.cos(a) * 22;
    var sy = p.y + Math.sin(a) * 22;
    G.bullets.push({
      x: sx, y: sy,
      vx: Math.cos(a) * 1050, vy: Math.sin(a) * 1050,
      dmg: baseDmg, life: 1.0, team: 'player'
    });
  }
  G.flashes.push({ x: p.x + Math.cos(p.angle) * 22, y: p.y + Math.sin(p.angle) * 22, r: 150, life: 0.06, max: 0.06 });
  G.shake = Math.min(4, G.shake + (gun.pellets > 1 ? 2 : 0.9));
  for (var k = 0; k < 3; k++) {
    var pa = p.angle + rand(-0.2, 0.2);
    G.particles.push({
      x: p.x + Math.cos(pa) * 22, y: p.y + Math.sin(pa) * 22,
      vx: Math.cos(pa) * rand(60, 200), vy: Math.sin(pa) * rand(60, 200),
      life: 0.14, max: 0.14, color: '#ffdd88', size: 2.5
    });
  }
}

function punch(p) {
  if (!p || p.down || p.punchCd > 0) return;
  p.punchCd = 0.42;
  p.punchAnim = 1;
  var range = 50, hitAny = false;
  var pdmg = 2 + G.playerDmgBonus + metaDamageBonus();
  for (var i = 0; i < G.robbers.length; i++) {
    var r = G.robbers[i];
    if (dist(p.x, p.y, r.x, r.y) < range + r.r) {
      var ang = Math.atan2(r.y - p.y, r.x - p.x);
      damageRobber(r, pdmg, ang, 330);
      hitAny = true;
    }
  }
  if (hitAny) {
    G.shake = Math.min(7, G.shake + 3);
    G.flashes.push({ x: p.x + Math.cos(p.angle) * 30, y: p.y + Math.sin(p.angle) * 30, r: 110, life: 0.08, max: 0.08 });
  }
}
