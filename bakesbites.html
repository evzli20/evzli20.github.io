<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bakes &amp; Bites · Home Bakery Orders</title>
<style>
:root{--bg:#fbeee4;--fg:#4a3328;--card:#fffaf6;--mut:#7d6556;--pri:#e0735c;--berry:#d9526b;--bd:#f0d9c8;--inset:#f5e4d6;--sh:rgba(170,100,70,.22);--mint:#4fb585;--mintl:#dff3e7;--sun:#f3c04a;--sunl:#fbf0cf;--pinkl:#fbe3e6;--pad:0px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f1a;--fg:#f6ebe2;--card:#3a2c25;--mut:#c4ab9b;--bd:#54413a;--inset:#45342d;--sh:rgba(0,0,0,.5);--mintl:#2e4a3b;--sunl:#4a4026;--pinkl:#4d2f36}}
:root[data-theme="dark"]{--bg:#2a1f1a;--fg:#f6ebe2;--card:#3a2c25;--mut:#c4ab9b;--bd:#54413a;--inset:#45342d;--sh:rgba(0,0,0,.5);--mintl:#2e4a3b;--sunl:#4a4026;--pinkl:#4d2f36}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font:16px/1.5 "Baloo 2",ui-rounded,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd)}.barin{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.logo{display:flex;gap:10px;align-items:center;font-weight:800;font-size:1.25rem;text-decoration:none;color:inherit}
.logo span{font-size:1.5rem}
.clay{background:var(--card);border-radius:28px;box-shadow:0 10px 24px -6px var(--sh),inset 0 -8px 16px -8px var(--sh)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;font-size:.9rem;border:0;border-radius:20px;padding:9px 20px;background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;box-shadow:0 8px 16px -4px var(--sh),inset 0 -5px 12px -6px var(--sh);transition:transform .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#ee8a6e,var(--berry));color:#fff}
.btn.big{padding:13px 28px;font-size:1rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
nav{display:flex;gap:10px;align-items:center}
.badge{display:inline-block;background:var(--pri);color:#fff;border-radius:99px;font-size:.7rem;padding:0 7px;margin-left:4px}
.pill{display:inline-block;border-radius:99px;padding:3px 12px;font-size:.75rem;font-weight:700}
h1{font-size:clamp(2.4rem,7vw,3.6rem);line-height:1.05;font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.7rem,4vw,2.2rem);font-weight:800}
.berry{color:var(--berry)}.mut{color:var(--mut)}
.hero{display:grid;gap:36px;align-items:center;padding:30px 0 50px}
@media(min-width:850px){.hero{grid-template-columns:1.1fr .9fr}}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid3{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.item{padding:clamp(14px,2vw,22px)}
.emoji{background:var(--inset);border-radius:22px;height:100px;display:flex;align-items:center;justify-content:center;font-size:3.4rem;box-shadow:inset 0 3px 8px var(--sh)}
section{padding:36px 0}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:var(--inset);color:var(--fg);font:inherit;font-weight:800;font-size:1.1rem;cursor:pointer}
.qty b{min-width:20px;text-align:center}
label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 4px}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:var(--inset);border:2px solid var(--bd);border-radius:16px;padding:9px 14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri)}
.seg{display:flex;gap:10px}.seg button{flex:1}
.seg .btn.on{background:var(--pri);color:#fff}
.two{display:grid;gap:22px}
@media(min-width:850px){.two{grid-template-columns:1.4fr 1fr}}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.tot{border-top:2px dashed var(--bd);margin-top:8px;padding-top:8px;font-weight:800;font-size:1.2rem}
.qr{width:180px;height:180px;margin:14px auto;background:repeating-conic-gradient(var(--fg) 0 25%,var(--card) 0 50%) 0 0/24px 24px;border-radius:12px;border:8px solid var(--card)}
.err{color:#d03c4a;font-size:.85rem;margin-top:10px;min-height:1.2em}
footer{border-top:1px solid var(--bd);padding:26px 0;text-align:center;color:var(--mut);font-size:.9rem;margin-top:30px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:99px;font-weight:700;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ord{padding:20px;margin-bottom:16px}
.brand{height:44px;width:auto;border-radius:14px;display:block;box-shadow:0 6px 14px -4px var(--sh)}.emoji.ph{height:auto;aspect-ratio:1/1}.emoji img{width:100%;height:100%;object-fit:cover}.th{width:36px;height:36px;border-radius:10px;object-fit:cover;vertical-align:middle}
.det{display:grid;gap:26px}@media(min-width:850px){.det{grid-template-columns:1fr 1fr}}.bigimg{width:100%;border-radius:24px;display:block;box-shadow:0 10px 24px -6px var(--sh)}.lnk{color:inherit;text-decoration:none;display:block}.cartbar{position:fixed;left:0;right:0;margin:0 auto;width:max-content;max-width:94vw;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;padding:12px 24px;white-space:nowrap}.cartbar[hidden]{display:none}footer{margin-bottom:64px}
.grid3.menu{--cw:clamp(150px,24vw,270px);grid-template-columns:repeat(auto-fill,var(--cw));justify-content:center;gap:clamp(10px,1.6vw,18px)}
.menu .item h3{font-size:clamp(.95rem,1.5vw,1.1rem);line-height:1.2}
.menu .item p{font-size:clamp(.75rem,1.1vw,.88rem)!important;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.menu .item b.berry{font-size:clamp(1rem,1.6vw,1.2rem)!important}
.menu .btn{padding:7px 16px}
.bigimg{max-width:clamp(240px,40vw,440px)}
.stars button{background:none;border:0;font-size:2.2rem;line-height:1;color:var(--bd);cursor:pointer;padding:0 2px}.stars button.on{color:var(--sun)}
.bar .brand{height:38px}.bar .btn{padding:8px 16px;font-size:.88rem}.bar nav{gap:8px}.sm{display:none}html{scroll-padding-top:70px}@media(max-width:480px){.lg,.tot2{display:none}.sm{display:inline}.bar .brand{height:28px}.bar .btn{padding:7px 11px;font-size:.8rem}.bar nav{gap:6px}}
</style></head><body>

<div class="row" style="justify-content:space-between"><span class="pill" style="background:var(--pinkl);color:var(--berry)">⏰ Ready in 24h</span><b class="berry" style="font-size:1.5rem">RM15</b></div>
<div class="emoji ph" style="margin:22px 0"><img src="${IMG.salt}" alt="Sea-salt Brownies"></div>
<h3 style="font-size:1.5rem">Sea-salt Brownies</h3><p class="mut" style="font-size:.9rem">Fudgy classic dark chocolate finished with flaky sea salt.</p>

<div class="grid3">
${[["1","✨","Pick your brownies","Browse the menu and choose quantities — everything is baked to order in our home kitchen."],["2","⏰","Choose pickup or delivery","Reserve a pickup slot, or have us hand-deliver on a date and window that suits you."],["3","👛","Pay to confirm","FPX online banking or DuitNow QR — your order is only confirmed once payment lands."]].map(s=>`<div class="clay item"><div style="font-size:2rem;font-weight:800;float:right;opacity:.15">${s[0]}</div><div style="font-size:1.8rem">${s[1]}</div><h3>${s[2]}</h3><p class="mut" style="font-size:.9rem">${s[3]}</p></div>`).join("")}</div></section>
<section id="menu"><div class="row" style="justify-content:space-between;margin-bottom:22px"><div><span class="pill" style="background:var(--sunl)">Fresh from the oven</span><h2>This week’s menu</h2></div><a class="btn" href="#menu">See the full menu →</a></div>

const DETAIL={
salt:{long:"Our signature bake: a deep, fudgy dark-chocolate brownie with a glossy crackle top, finished with flaky sea salt so every bite balances bittersweet and salty. Baked to order and cut into generous squares.",ing:"Dark chocolate, butter, eggs, sugar, flour, cocoa, sea salt",keep:"3 days room temp · 7 days chilled"},
brookie:{long:"Can’t choose between a brownie and a cookie? The brookie has a chewy, crackly chocolate-cookie top over a fudgy brownie base, sprinkled with flaky sea salt.",ing:"Dark chocolate, butter, eggs, brown sugar, flour, sea salt",keep:"3 days room temp"},
plum:{long:"A refreshing bottled drink of zesty lime and salty-sweet sour plum (asam boi), brewed in small batches. Serve over lots of ice for a cooling, tangy treat. Shake before opening.",ing:"Lime, sour plum, sugar, water",keep:"Keep chilled · 2 weeks unopened"},
bites:{long:"A crunchy, lightly savoury snack mix of oven-baked almonds, pumpkin seeds and sunflower seeds. Great for desks, road trips and gifting.",ing:"Almonds, pumpkin seeds, sunflower seeds, sea salt",keep:"4 weeks in an airtight container"},
pink:{long:"Rich chocolate brownies with a delicate white-chocolate drizzle and hand-scattered dried rose petals. Pretty enough for gifting and just as fudgy as our classics.",ing:"Dark chocolate, white chocolate, butter, eggs, sugar, flour, dried rose petals",keep:"3 days room temp · 7 days chilled"},
four:{long:"Our signature sampler: four brownie flavours in one box — Signature Seasalt, Dark Mint with a green marbled glaze, Double Dark with a chocolate drizzle, and French Rose with white chocolate and rose petals.",ing:"Dark chocolate, white chocolate, butter, eggs, sugar, flour, peppermint, rose petals",keep:"3 days room temp · 7 days chilled"},
mint:{long:"Rich chocolate fudge brownies topped with a cool peppermint glaze for a fresh-meets-decadent bite.",ing:"Dark chocolate, butter, eggs, sugar, flour, peppermint",keep:"3 days room temp · 7 days chilled"},
walnut:{long:"Dense, fudgy brownies studded with toasted walnuts for a nutty crunch in every square.",ing:"Dark chocolate, butter, eggs, sugar, flour, walnuts",keep:"3 days room temp"},
matcha:{long:"Earthy matcha brownie swirled with creamy white chocolate — lightly bitter, lightly sweet.",ing:"White chocolate, matcha, butter, eggs, sugar, flour",keep:"3 days room temp"},
blondie:{long:"Chewy brown-sugar blondies with a gooey salted caramel centre and a golden crinkly top.",ing:"Brown sugar, butter, eggs, flour, caramel, sea salt",keep:"3 days room temp"},
cookies:{long:"Six crisp-edged, soft-centred cookies loaded with big dark chocolate chunks and a pinch of salt.",ing:"Dark chocolate, butter, brown sugar, eggs, flour, sea salt",keep:"5 days in an airtight tin"},
biscoff:{long:"Silky no-bake cheesecake layered with crushed Biscoff biscuits and a spiced biscuit crumb on top.",ing:"Cream cheese, cream, Biscoff biscuits, sugar",keep:"Keep chilled · 3 days"},
tiramisu:{long:"Espresso-soaked sponge layered with mascarpone cream and dusted with cocoa, in a handy single-serve cup.",ing:"Mascarpone, cream, espresso, sponge, cocoa",keep:"Keep chilled · 2 days"},
giftbox:{long:"A ribboned box of nine mixed brownies — perfect for birthdays, festive gifting and thank-yous.",ing:"Assorted brownies (see individual flavours)",keep:"3 days room temp"}};
let detQty=1;
function itemPage(id){
const i=MENU.find(x=>x.id===id);if(!i)return fullmenu();
const d=DETAIL[id]||{},n=cart[id]||0;
return `<section><a class="btn" href="#menu">← Back to menu</a>
<div class="det" style="margin-top:20px"><div>${IMG[id]?`<img class="bigimg" src="${IMG[id]}" alt="${i.name.replace(/"/g,"")}">`:`<div class="emoji ph" style="font-size:7rem">${i.emoji}</div>`}</div>
<div><span class="pill" style="background:var(--sunl)">${i.cat||"Brownies"}</span><h2 style="margin-top:8px">${i.name}</h2><b class="berry" style="font-size:1.6rem">${rm(i.price)}</b>
<p style="margin:14px 0">${d.long||i.desc}</p>
<div class="clay item sum" style="padding:16px"><div><span class="mut">Ingredients</span><span style="text-align:right;max-width:65%">${d.ing||"—"}</span></div><div><span class="mut">Keeps</span><span style="text-align:right">${d.keep||"—"}</span></div><div><span class="mut">Lead time</span><span>Order 1 day ahead</span></div></div>
<p class="mut" style="font-size:.8rem;margin:10px 0 18px">Baked in a home kitchen that also handles nuts, dairy, eggs and gluten.</p>
<div class="row"><div class="qty"><button data-dq="-1" aria-label="Less">−</button><b>${detQty}</b><button data-dq="1" aria-label="More">+</button></div><button class="btn pri big" data-addq="${id}">Add to cart · ${rm(detQty*i.price)}</button></div>
${n?`<div class="row" style="margin-top:18px"><span class="pill" style="background:var(--mintl)">✓ ${n} in your cart</span><a class="btn" href="#menu">Continue shopping</a><a class="btn pri" href="#order">Checkout →</a></div>`:""}
</div></div>${reviewsBlock(id)}</section>`}
function itemReviewForm(){return `<div class="stars">${[1,2,3,4,5].map(n=>`<button data-istar="${n}" class="${n<=irStars?"on":""}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div><label>Your name</label><input id="irname" value="${esc(irName)}" placeholder="e.g. Aisyah"><label>Comment (optional)</label><textarea id="irtext" rows="3" placeholder="What did you think?">${esc(irText)}</textarea><div class="err" id="irerr"></div><div class="row" style="margin-top:8px"><button class="btn pri" id="irsave">Submit review</button><button class="btn" id="ircancel">Cancel</button></div>`}
function reviewsBlock(id){
const list=REV.filter(r=>r.item===id),mine=list[0];
const avg=list.length?list.reduce((s,r)=>s+r.stars,0)/list.length:0;
const open=irOpen===id;
return `<div class="clay item" style="margin-top:26px"><div class="row" style="justify-content:space-between"><h3>Reviews${list.length?` <span class="mut" style="font-size:.9rem">· ${avg.toFixed(1)} ★ (${list.length})</span>`:""}</h3>${open?"":`<button class="btn pri" data-irev="${id}">${mine?"Edit your review":"★ Write a review"}</button>`}</div>
${open?itemReviewForm():""}
${list.length?list.map(r=>`<div style="padding:12px 0;border-top:1px solid var(--bd)">${stars(r.stars)} <b>${esc(r.name||"Anonymous")}</b>${r.verified?' <span class="pill" style="background:var(--mintl)">✓ Ordered</span>':""}<span class="mut" style="font-size:.8rem"> · ${new Date(r.date).toLocaleDateString("en-MY")}</span>${r.text?`<p style="margin-top:4px">${esc(r.text)}</p>`:""}</div>`).join(""):(open?"":'<p class="mut" style="margin-top:8px">No reviews yet — be the first!</p>')}</div>`}
function card(i){return `<div class="clay item"><a class="lnk" href="#item-${i.id}"><div class="emoji ${IMG[i.id]?"ph":""}">${pic(i)}</div><h3 style="margin-top:12px">${i.name}</h3><p class="mut" style="font-size:.9rem">${i.desc}</p><span class="berry" style="font-size:.85rem;font-weight:700">View details →</span></a>
<div class="row" style="justify-content:space-between;margin-top:14px"><b class="berry" style="font-size:1.25rem">${rm(i.price)}</b><button class="btn pri" data-add="${i.id}">Add</button></div></div>`}

function order(){
const s=sub(),fee=form.mode==="delivery"&&s?DELIVERY_FEE:0;
return `<section><div class="row" style="justify-content:space-between"><h2>Your cart &amp; checkout</h2><a class="btn" href="#menu">+ Add more items</a></div><div class="two" style="margin-top:20px">
<div><div class="clay item"><h3>1 · Choose brownies</h3>${MENU.map(i=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)"><div>${thumb(i)} <b>${i.name}</b><div class="mut" style="font-size:.85rem">${rm(i.price)}</div></div><div class="qty"><button data-add="${i.id}" data-n="-1" aria-label="Less">−</button><b>${cart[i.id]||0}</b><button data-add="${i.id}" aria-label="More">+</button></div></div>`).join("")}</div>
<div class="clay item" style="margin-top:18px"><h3>2 · Pickup or delivery</h3>
<div class="seg" style="margin-top:10px"><button class="btn ${form.mode==="pickup"?"on":""}" data-mode="pickup">🏪 Pickup</button><button class="btn ${form.mode==="delivery"?"on":""}" data-mode="delivery">🚚 Delivery (+${rm(DELIVERY_FEE)})</button></div>
<label>Date</label><input type="date" id="date" min="${minDate()}" value="${form.date}">
<label>Time window</label><select id="slot">${SLOTS.map(t=>`<option ${t===form.slot?"selected":""}>${t}</option>`).join("")}</select>
<label>Your name</label><input id="name" value="${esc(form.name)}" autocomplete="name">
<label>Phone</label><input id="phone" type="tel" value="${esc(form.phone)}" placeholder="012-345 6789" autocomplete="tel">
${form.mode==="delivery"?`<label>Delivery address</label><textarea id="address" rows="2">${esc(form.address)}</textarea>`:""}
<label>Notes (optional)</label><input id="notes" value="${esc(form.notes)}" placeholder="Allergies, gift message…"></div></div>
<div><div class="clay item sum" style="position:sticky;top:12px"><h3>Summary</h3>
${MENU.filter(i=>cart[i.id]).map(i=>`<div><span>${cart[i.id]} × ${i.name}</span><span>${rm(cart[i.id]*i.price)}</span></div>`).join("")||'<p class="mut">Your cart is empty.</p>'}
${fee?`<div><span>Delivery</span><span>${rm(fee)}</span></div>`:""}
<div class="tot"><span>Total</span><span class="berry">${rm(s+fee)}</span></div>
<div class="err" id="err"></div>
<button class="btn pri big" style="width:100%" id="checkout" ${s?"":"disabled"}>Continue to payment</button></div></div></div></section>`}

function fullmenu(){
const list=MENU.filter(i=>menuCat==="All"||(i.cat||"Brownies")===menuCat);
return `<section><div class="row" style="justify-content:space-between"><div><span class="pill" style="background:var(--sunl)">Baked to order</span><h2>The full menu</h2></div><a class="btn pri" href="#order">Checkout${count()?" ("+count()+")":""} →</a></div>
<div class="row" style="margin:20px 0">${CATS.map(c=>`<button class="btn ${c===menuCat?"pri":""}" data-cat="${c}">${c}</button>`).join("")}</div>
<div class="grid3 menu">${list.map(card).join("")}</div></section>`}

function pay(){const o=pending;return `<section><div class="clay item" style="max-width:480px;margin:auto;text-align:center">
<h2>Pay to confirm</h2><p class="mut">Order ${o.id} · <b class="berry">${rm(o.total)}</b></p>
<div class="seg" style="margin:16px 0"><button class="btn ${form.pay==="fpx"?"on":""}" data-pay="fpx">FPX</button><button class="btn ${form.pay==="duitnow"?"on":""}" data-pay="duitnow">DuitNow QR</button></div>
${form.pay==="fpx"?`<label style="text-align:left">Choose your bank</label><select id="bank">${BANKS.map(b=>`<option ${b===form.bank?"selected":""}>${b}</option>`).join("")}</select>`:`<div class="qr" role="img" aria-label="DuitNow QR placeholder"></div><p class="mut" style="font-size:.85rem">Scan with any banking or e-wallet app.</p>`}
<p class="mut" style="font-size:.8rem;margin:14px 0">Demo mode: no real payment is taken. Connect a payment gateway to go live.</p>
<button class="btn pri big" style="width:100%" id="paid">${form.pay==="fpx"?"Pay with FPX":"I’ve paid"}</button>
<button class="btn" style="width:100%;margin-top:10px" id="back">← Back to order</button></div></section>`}

function cartPage(){
const s=sub(),list=MENU.filter(i=>cart[i.id]);
return `<section><h2>Your cart</h2><div class="clay item" style="margin-top:20px;max-width:560px">${list.length?list.map(i=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)"><div>${thumb(i)} <b>${i.name}</b><div class="mut" style="font-size:.85rem">${rm(i.price)}</div></div><div class="qty"><button data-add="${i.id}" data-n="-1" aria-label="Less">−</button><b>${cart[i.id]}</b><button data-add="${i.id}" aria-label="More">+</button></div></div>`).join("")+`<a class="btn pri big" style="width:100%;margin-top:16px" href="#order">Checkout · ${rm(s)}</a>`:`<p class="mut" style="text-align:center">Your cart is empty.</p>`}</div></section>`}
let rvFor=null,rvStars=0,rvText="";
function stars(n){return '<span style="color:var(--sun);letter-spacing:2px">'+"★".repeat(n)+'<span style="opacity:.3">'+"★".repeat(5-n)+'</span></span>'}
function reviewForm(){return `<div class="stars">${[1,2,3,4,5].map(n=>`<button data-star="${n}" class="${n<=rvStars?"on":""}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div><label>Comment (optional)</label><textarea id="rvtext" rows="3" placeholder="Tell us what you loved…">${esc(rvText)}</textarea><div class="err" id="rverr"></div><div class="row" style="margin-top:8px"><button class="btn pri" id="rvsave">Submit review</button><button class="btn" id="rvcancel">Cancel</button></div>`}
function orderDetail(id){
const o=orders.find(x=>x.id===id);
if(!o)return `<section><div class="clay item" style="text-align:center"><p class="mut">Order not found.</p><a class="btn pri" style="margin-top:12px" href="#orders">Back to my orders</a></div></section>`;
const line=i=>{const m=MENU.find(x=>x.id===i.id||x.name===i.name);const pr=i.price!=null?i.price:(m?m.price:null);return pr==null?null:pr*i.qty};
const subt=o.items.reduce((s,i)=>s+(line(i)||0),0);
const fee=o.fee!=null?o.fee:Math.max(0,o.total-subt);
const open=rvFor===o.id;
return `<section><a class="btn" href="#orders">← My orders</a>
<div class="two" style="margin-top:20px">
<div class="clay item"><div class="row" style="justify-content:space-between"><h2>${o.id}</h2><span class="pill" style="background:var(--mintl)">✓ ${o.status}</span></div>
<p class="mut" style="font-size:.9rem">Placed ${new Date(o.created).toLocaleString("en-MY")}</p>
<h3 style="margin-top:18px">Items</h3>
<div class="sum">${o.items.map(i=>`<div><span>${i.qty} × ${esc(i.name)}</span><span>${line(i)!=null?rm(line(i)):""}</span></div>`).join("")}${fee?`<div><span>Delivery</span><span>${rm(fee)}</span></div>`:""}<div class="tot"><span>Total</span><span class="berry">${rm(o.total)}</span></div></div>
<p class="mut" style="font-size:.85rem;margin-top:8px">Paid via ${esc(o.pay)}</p></div>
<div><div class="clay item sum"><h3>${o.mode==="delivery"?"🚚 Delivery":"🏪 Pickup"}</h3>
<div><span class="mut">Date</span><span>${esc(o.date)}</span></div><div><span class="mut">Time</span><span>${esc(o.slot)}</span></div>
<div><span class="mut">Name</span><span>${esc(o.name)}</span></div><div><span class="mut">Phone</span><span>${esc(o.phone)}</span></div>
${o.mode==="delivery"?`<div><span class="mut">Address</span><span style="text-align:right;max-width:65%">${esc(o.address)}</span></div>`:""}
${o.notes?`<div><span class="mut">Notes</span><span style="text-align:right;max-width:65%">${esc(o.notes)}</span></div>`:""}</div>
<div class="clay item" style="margin-top:18px"><h3>Your review</h3>
${open?reviewForm():o.review?`<p>${stars(o.review.stars)}</p>${o.review.text?`<p style="margin:8px 0">${esc(o.review.text)}</p>`:""}<button class="btn" data-review="${o.id}">Edit review</button>`:`<p class="mut" style="margin-bottom:12px">How were your treats? Tell us what you thought.</p><button class="btn pri" data-review="${o.id}">★ Leave a review</button>`}</div></div></div></section>`}

function orders_(){return `<section><h2>My orders</h2><div style="margin-top:20px">${orders.length?orders.map(o=>`<div class="clay ord"><a class="lnk" href="#o-${o.id}"><div class="row" style="justify-content:space-between"><b>${o.id}</b><span class="pill" style="background:var(--mintl)">✓ ${o.status}</span></div>
<p class="mut" style="font-size:.9rem">${new Date(o.created).toLocaleString("en-MY")} · ${o.mode==="delivery"?"Delivery":"Pickup"} on ${o.date}, ${o.slot}</p>
<p>${o.items.map(i=>`${i.qty} × ${esc(i.name)}`).join(", ")}</p><b class="berry">${rm(o.total)}</b> <span class="mut">· paid via ${o.pay}</span></a><div class="row" style="margin-top:12px"><a class="btn" href="#o-${o.id}">View details</a>${o.review?`<span>${stars(o.review.stars)}</span>`:`<button class="btn pri" data-review="${o.id}">★ Leave a review</button>`}</div></div>`).join(""):`<div class="clay item" style="text-align:center"><p class="mut">No orders yet.</p><a class="btn pri" style="margin-top:12px" href="#order">Order now</a></div>`}</div>
${orders.length?'<button class="btn" id="clear">Clear order history</button>':""}</section>`}

function render(){
const v=(location.hash||"#home").slice(1);
if(v==="pay"&&!pending){location.hash="#order";return}
app.innerHTML=v==="cart"?cartPage():v.startsWith("o-")?orderDetail(v.slice(2)):v.startsWith("item-")?itemPage(v.slice(5)):v==="menu"?fullmenu():v==="order"?order():v==="orders"?orders_():v==="pay"?pay():home();
const c=$("#cnt");c.hidden=!count();c.textContent=count();
$("#cartlbl").textContent=count()?" · "+rm(sub()):"";
}
window.addEventListener("hashchange",()=>{detQty=1;irOpen=null;render();scrollTo(0,0)});

function readForm(){["date","slot","name","phone","address","notes"].forEach(k=>{const e=document.getElementById(k);if(e)form[k]=e.value})}
document.addEventListener("click",e=>{
const t=e.target.closest("button,a");if(!t)return;
if(t.dataset.scroll){const el=document.getElementById(t.dataset.scroll);el&&el.scrollIntoView({behavior:"smooth"});return}
if(t.dataset.add){readForm();add(t.dataset.add,+(t.dataset.n||1));if(t.dataset.go)location.hash="#"+t.dataset.go;else render();return}
if(t.dataset.irev){const r=REV.find(x=>x.item===t.dataset.irev);irOpen=t.dataset.irev;irStars=r?r.stars:0;irText=r?r.text:"";irName=r?r.name:(form.name||"");render();return}
if(t.dataset.istar){const a=$("#irname"),b=$("#irtext");if(a)irName=a.value;if(b)irText=b.value;irStars=+t.dataset.istar;render();return}
if(t.id==="ircancel"){irOpen=null;render();return}
if(t.id==="irsave"){const a=$("#irname"),b=$("#irtext");if(a)irName=a.value;if(b)irText=b.value;if(!irStars){$("#irerr").textContent="Please tap a star rating.";return}
const id=irOpen,m=MENU.find(x=>x.id===id),ver=orders.some(o=>o.items.some(i=>itemId(i)===id));
REV=REV.filter(x=>x.item!==id);REV.push({item:id,stars:irStars,text:irText.trim(),name:irName.trim(),date:Date.now(),verified:ver});saveRev();irOpen=null;toast("Thanks for your review!");render();return}
if(t.dataset.review){const o=orders.find(x=>x.id===t.dataset.review);rvFor=t.dataset.review;rvStars=o&&o.review?o.review.stars:0;rvText=o&&o.review?o.review.text:"";if(location.hash==="#o-"+rvFor)render();else location.hash="#o-"+rvFor;return}
if(t.dataset.star){const ta=$("#rvtext");if(ta)rvText=ta.value;rvStars=+t.dataset.star;render();return}
if(t.id==="rvcancel"){rvFor=null;render();return}
if(t.id==="rvsave"){const ta=$("#rvtext");if(ta)rvText=ta.value;if(!rvStars){$("#rverr").textContent="Please tap a star rating.";return}const o=orders.find(x=>x.id===rvFor);if(o){o.review={stars:rvStars,text:rvText.trim(),date:Date.now()};save();o.items.forEach(i=>{const k=itemId(i);if(k&&!REV.some(x=>x.item===k))REV.push({item:k,stars:rvStars,text:rvText.trim(),name:o.name,date:Date.now(),verified:true})});saveRev()}rvFor=null;toast("Thanks for your review!");render();return}
if(t.dataset.dq){detQty=Math.max(1,detQty+ +t.dataset.dq);render();return}
if(t.dataset.addq){cart[t.dataset.addq]=(cart[t.dataset.addq]||0)+detQty;toast("Added "+detQty+" to your cart");detQty=1;render();return}
if(t.dataset.cat){menuCat=t.dataset.cat;render();return}
if(t.dataset.mode){readForm();form.mode=t.dataset.mode;render();return}
if(t.dataset.pay){form.pay=t.dataset.pay;render();return}
if(t.id==="back"){location.hash="#order";return}
if(t.id==="clear"){if(confirm("Clear all saved orders?")){orders=[];save();render()}return}
if(t.id==="checkout"){
readForm();const er=$("#err");let m="";
if(!form.date)m="Please choose a date.";else if(form.date<minDate())m="Pickup and delivery dates must be at least 1 day from today.";else if(!form.name.trim())m="Please enter your name.";else if(!/^[0-9+\-\s]{8,15}$/.test(form.phone.trim()))m="Please enter a valid phone number.";else if(form.mode==="delivery"&&!form.address.trim())m="Please enter a delivery address.";
